name: CI

# Pull requests had no checks at all. Vercel's preview build was the only signal, and it
# proves one thing: the code compiled. Lint and type-check were run by hand or not at all.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      # No RESEND_API_KEY here on purpose: the contact route's unconfigured path is one
      # of the things under test, and a key in CI would send real mail.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
